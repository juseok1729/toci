name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"

          build() {
            local goos="$1" goarch="$2" triple="$3"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -ldflags="-s -w -X main.version=${VERSION}" -trimpath -o dist/toci ./cmd/toci
            tar -C dist -czf "dist/toci-${triple}.tar.gz" toci
            rm dist/toci
          }

          build linux amd64 x86_64-unknown-linux-gnu
          build linux arm64 aarch64-unknown-linux-gnu
          build darwin amd64 x86_64-apple-darwin
          build darwin arm64 aarch64-apple-darwin

          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/checksums.txt \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
